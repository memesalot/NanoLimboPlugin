plugins {
    id 'com.gradleup.shadow' version '9.4.2'
}

allprojects {
    group 'ua.nanit'
    version '2.0.0'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.gradleup.shadow'

    compileJava {
        options.encoding = "UTF-8"
    }

    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok:1.18.46'
        annotationProcessor 'org.projectlombok:lombok:1.18.46'

        // Adventure 4.x line: binary-compatible with Velocity's bundled adventure.
        // Do NOT bump to 5.x here — Velocity provides adventure parent-first.
        implementation 'net.kyori:adventure-api:4.26.1'
        implementation 'net.kyori:adventure-nbt:4.26.1'
        implementation 'net.kyori:adventure-text-serializer-gson:4.26.1'
        implementation 'net.kyori:adventure-text-serializer-legacy:4.26.1'
        implementation 'net.kyori:adventure-text-serializer-plain:4.26.1'
        implementation 'net.kyori:adventure-text-minimessage:4.26.1'
        implementation 'net.kyori:adventure-text-serializer-json-legacy-impl:4.26.1'

        compileOnly 'org.jetbrains:annotations:26.0.2'
    }

    shadowJar {
        from rootProject.file('LICENSE')
        minimize()
    }

    test {
        useJUnitPlatform()
    }
}
